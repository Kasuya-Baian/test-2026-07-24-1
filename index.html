<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ジャイロセンサー検知テスト</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #00e676;
      --danger-color: #ff5252;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(0,230,118,0.3);
    }

    .status-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border-left: 4px solid var(--accent-color);
    }

    .status-card.error {
      border-left-color: var(--danger-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: #aaa;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .data-box {
      background-color: #2a2a2a;
      padding: 10px 4px;
      border-radius: 6px;
    }

    .data-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }

    .data-value {
      font-size: 1.1rem;
      font-weight: bold;
      font-family: monospace;
    }

    /* 視覚的ビジュアルボール */
    .stage {
      width: 100%;
      height: 120px;
      background-color: #2a2a2a;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-top: 12px;
    }

    .ball {
      width: 24px;
      height: 24px;
      background-color: var(--accent-color);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--accent-color);
    }
  </style>
</head>
<body>

  <h1>ジャイro / 加速度 センサーモニター</h1>

  <button id="start-btn" class="btn">センサー起動（アクセス許可）</button>

  <div id="status-card" class="status-card">
    <div id="status-text">「センサー起動」ボタンを押してください。</div>
  </div>

  <!-- 1. ジャイロ（傾き/回転角） -->
  <div class="card">
    <h2>傾き (DeviceOrientation) [度]</h2>
    <div class="grid">
      <div class="data-box">
        <div class="data-label">α (Z軸/方角)</div>
        <div id="ori-alpha" class="data-value">0</div>
      </div>
      <div class="data-box">
        <div class="data-label">β (X軸/前後)</div>
        <div id="ori-beta" class="data-value">0</div>
      </div>
      <div class="data-box">
        <div class="data-label">γ (Y軸/左右)</div>
        <div id="ori-gamma" class="data-value">0</div>
      </div>
    </div>

    <!-- 傾きを連動させるボール -->
    <div class="stage">
      <div id="visual-ball" class="ball"></div>
    </div>
  </div>

  <!-- 2. 加速度 (重力含む) -->
  <div class="card">
    <h2>加速度 (DeviceMotion) [m/s²]</h2>
    <div class="grid">
      <div class="data-box">
        <div class="data-label">X軸 (左右)</div>
        <div id="acc-x" class="data-value">0</div>
      </div>
      <div class="data-box">
        <div class="data-label">Y軸 (上下)</div>
        <div id="acc-y" class="data-value">0</div>
      </div>
      <div class="data-box">
        <div class="data-label">Z軸 (前後)</div>
        <div id="acc-z" class="data-value">0</div>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const statusCard = document.getElementById('status-card');
    const statusText = document.getElementById('status-text');

    // 表示要素
    const elAlpha = document.getElementById('ori-alpha');
    const elBeta = document.getElementById('ori-beta');
    const elGamma = document.getElementById('ori-gamma');

    const elAccX = document.getElementById('acc-x');
    const elAccY = document.getElementById('acc-y');
    const elAccZ = document.getElementById('acc-z');

    const visualBall = document.getElementById('visual-ball');

    // 傾き（Orientation）イベントハンドラ
    function handleOrientation(event) {
      const alpha = event.alpha ? event.alpha.toFixed(1) : 0;
      const beta  = event.beta  ? event.beta.toFixed(1)  : 0;
      const gamma = event.gamma ? event.gamma.toFixed(1) : 0;

      elAlpha.textContent = alpha;
      elBeta.textContent  = beta;
      elGamma.textContent = gamma;

      // ボールのリアルタイムビジュアル移動 (gamma: 左右, beta: 前後)
      // ステージ枠から出ないように制御
      const maxOffset = 50; // px
      const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

      const offsetX = clamp((gamma / 45) * maxOffset, -maxOffset, maxOffset);
      const offsetY = clamp((beta / 45) * maxOffset, -maxOffset, maxOffset);

      visualBall.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
    }

    // 加速度（Motion）イベントハンドラ
    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      elAccX.textContent = acc.x ? acc.x.toFixed(2) : 0;
      elAccY.textContent = acc.y ? acc.y.toFixed(2) : 0;
      elAccZ.textContent = acc.z ? acc.z.toFixed(2) : 0;
    }

    // センサー実行開始
    async function startSensors() {
      // 通信環境チェック
      if (!window.isSecureContext) {
        statusCard.classList.add('error');
        statusText.innerHTML = '⚠️ <strong>エラー:</strong> センサーの取得にはHTTPS環境（またはlocalhost）が必要です。';
        return;
      }

      try {
        // iOS 13+ のパーミッション要求
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            statusCard.classList.add('error');
            statusText.textContent = '❌ センサーの利用許可が得られませんでした。';
            return;
          }
        }

        // イベントリスナーの登録
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.addEventListener('devicemotion', handleMotion, true);

        startBtn.style.display = 'none';
        statusText.style.color = '#00e676';
        statusText.textContent = '🟢 センサー計測中... スマホを傾けたり動かしたりしてください。';

      } catch (err) {
        statusCard.classList.add('error');
        statusText.textContent = 'エラーが発生しました: ' + err.message;
      }
    }

    startBtn.addEventListener('click', startSensors);
  </script>
</body>
</html>
