<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スマホ傾きブロックくずし</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      font-size: 1.2rem;
      margin: 10px 0 5px;
    }
    canvas {
      background: #222;
      display: block;
      margin: 0 auto;
      border: 2px solid #555;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    #start-btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #00adb5;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    #debug-log {
      font-size: 0.8rem;
      color: #00ffcc;
      margin-top: 8px;
      font-family: monospace;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <h1>傾きブロックくずし</h1>
  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <button id="start-btn">ゲームスタート（センサー起動）</button>
  <div id="debug-log">ボタンを押してゲームを開始してください</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start-btn");
    const debugLog = document.getElementById("debug-log");

    // ボール設定
    let ballRadius = 6;
    let x = canvas.width / 2;
    let y = canvas.height - 30;
    let dx = 2.5;
    let dy = -2.5;

    // パドル設定
    const paddleHeight = 10;
    const paddleWidth = 75;
    let paddleX = (canvas.width - paddleWidth) / 2;

    // ブロック設定
    const brickRowCount = 5;
    const brickColumnCount = 5;
    const brickWidth = 50;
    const brickHeight = 15;
    const brickPadding = 8;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 18;

    let bricks = [];
    function initBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
      }
    }
    initBricks();

    let score = 0;
    let isGameRunning = false;
    let sensorActive = false;

    // --- バイブレーション用変数 ---
    let lastVibeTime = 0;

    // バイブレーションを発生させる関数
    function triggerVibration(duration = 30) {
      // 連続で鳴り続けないようにクールダウン（200ms間隔）を設定
      const now = Date.now();
      if (now - lastVibeTime > 200) {
        if ("vibrate" in navigator) {
          // 30ミリ秒の短い振動
          navigator.vibrate(duration);
        }
        lastVibeTime = now;
      }
    }

    // パドル位置の更新関数（中心位置指定）
    function updatePaddlePosition(tiltAmount) {
      // tiltAmount は -1.0 (左最大) 〜 +1.0 (右最大)
      const sensitivity = 8; // 動くスピード
      paddleX += tiltAmount * sensitivity;

      // 画面端のガード処理
      if (paddleX < 0) paddleX = 0;
      if (paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;

      // 💡 一定以上の傾き（遊びの範囲を超えたとき）を検知したらバイブレーション
      if (Math.abs(tiltAmount) > 0.2) {
        triggerVibration(20); // 20msの微小な振動
      }
    }

    // 1. Orientation イベント（角度基準）
    function handleOrientation(event) {
      if (event.gamma !== null && event.gamma !== undefined) {
        sensorActive = true;
        let normalizedTilt = event.gamma / 30;
        if (normalizedTilt > 1) normalizedTilt = 1;
        if (normalizedTilt < -1) normalizedTilt = -1;

        debugLog.innerText = `Orientation (gamma): ${Math.round(event.gamma)}°`;
        updatePaddlePosition(normalizedTilt);
      }
    }

    // 2. Motion イベント（加速度基準）
    function handleMotion(event) {
      if (sensorActive) return;

      let acc = event.accelerationIncludingGravity;
      if (acc && acc.x !== null && acc.x !== undefined) {
        let normalizedTilt = -acc.x / 5; 
        if (normalizedTilt > 1) normalizedTilt = 1;
        if (normalizedTilt < -1) normalizedTilt = -1;

        debugLog.innerText = `Motion (acc.x): ${acc.x.toFixed(2)}`;
        updatePaddlePosition(normalizedTilt);
      }
    }

    // センサーアクセス権限の要求処理
    async function requestSensorPermissions() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          if (orientPermission !== 'granted') {
            debugLog.innerText = "iOS: 傾きセンサーのアクセスが拒否されました";
            return false;
          }
        } catch (e) {
          debugLog.innerText = "Permission Error: " + e.message;
          return false;
        }
      }

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch (e) {}
      }

      window.addEventListener("deviceorientation", handleOrientation, true);
      window.addEventListener("devicemotion", handleMotion, true);

      return true;
    }

    startBtn.addEventListener("click", async () => {
      startBtn.style.display = "none";
      const permitted = await requestSensorPermissions();
      
      if (permitted) {
        // スタート時にも合図として一度軽く振動させる
        triggerVibration(50);

        resetGame();
        isGameRunning = true;
        draw();
        
        setTimeout(() => {
          if (!sensorActive && debugLog.innerText.includes("ボタンを押して")) {
            debugLog.innerText = "センサー値を待機中... (スマホを傾けてみてください)";
          }
        }, 1000);
      }
    });

    function resetGame() {
      x = canvas.width / 2;
      y = canvas.height - 30;
      dx = 2.5;
      dy = -2.5;
      paddleX = (canvas.width - paddleWidth) / 2;
      score = 0;
      initBricks();
    }

    function collisionDetection() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status === 1) {
            if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
              dy = -dy;
              b.status = 0;
              score++;

              // 💡 ブロック破壊時にも強めのバイブレーションを発生させる
              triggerVibration(40);

              if (score === brickRowCount * brickColumnCount) {
                alert("クリア！おめでとうございます！");
                document.location.reload();
              }
            }
          }
        }
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff2e63";
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
      ctx.fillStyle = "#00adb5";
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = "#ececec";
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function drawScore() {
      ctx.font = "14px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText("SCORE: " + score, 10, 25);
    }

    function draw() {
      if (!isGameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
      drawScore();
      collisionDetection();

      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
      }
      if (y + dy < ballRadius) {
        dy = -dy;
      } else if (y + dy > canvas.height - ballRadius - 10) {
        if (x > paddleX && x < paddleX + paddleWidth) {
          dy = -dy;
          // 💡 ボールがパドルで跳ね返った時にもバイブレーション
          triggerVibration(30);
        } else if (y + dy > canvas.height - ballRadius) {
          // 💡 ゲームオーバー時（失敗）は少し長めにブルッと振動
          triggerVibration([100, 50, 100]); 
          alert("ゲームオーバー！");
          document.location.reload();
          return;
        }
      }

      x += dx;
      y += dy;

      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
